<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar BMN - Layanan Publik</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary: #1e40af;
            --secondary: #3b82f6;
            --background: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 1.5rem 5%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        .header-title p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .admin-link {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .admin-link:hover {
            background: white;
            color: var(--primary);
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 5%;
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            animation: fadeInUp 0.5s ease-out;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .filter-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #f8fafc;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .form-control {
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-light);
        }

        tr {
            transition: all 0.2s ease;
        }

        tr:hover {
            background: #f1f5f9;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-baik { background: #d1fae5; color: var(--success); }
        .badge-rusak-ringan { background: #fef3c7; color: var(--warning); }
        .badge-rusak-berat { background: #fee2e2; color: var(--danger); }

        .item-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1><i class="fas fa-boxes"></i> Layanan Informasi BMN</h1>
            <p>Sistem Informasi Inventory Ruangan</p>
        </div>
        <a href="admin.html" class="admin-link"><i class="fas fa-lock"></i> Login Admin</a>
    </header>

    <div class="container">
        <div class="card">
            <div class="table-controls">
                <h2 style="color: var(--primary); font-size: 1.2rem;"><i class="fas fa-list-check"></i> Daftar Barang Ruangan</h2>
                
                <div class="filter-box">
                    <label style="font-size: 0.85rem; color: var(--text-light);"><i class="fas fa-filter"></i> Ruangan:</label>
                    <div class="filter-box">
    <label style="font-size: 0.85rem; color: var(--text-light);"><i class="fas fa-filter"></i> Ruangan:</label>
    <select id="ruanganFilter" class="form-control" onchange="filterTable()">
        <option value="Semua">Semua Ruangan</option>
        <!-- Opsi lainnya akan diisi otomatis oleh JavaScript dari Firebase -->
    </select>
</div>
            </div>

            <div class="table-responsive">
                <table id="bmnTable">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nama Barang</th>
                            <th>Merk / Tipe</th>
                            <th>Lokasi</th>
                            <th>Kondisi</th>
                        </tr>
                    </thead>
                    <!-- Kosongkan isi tbody, biar Javascript yang mengisi data dari Firebase -->
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- PERBAIKAN: Gunakan library Firebase versi Compat agar sesuai dengan script di bawah -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        // 1. CONFIG FIREBASE ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyB0qOgDA7xq1hP5KkuDyFf8nAJyFAMvkRc",
            authDomain: "bmn-lapas-arma.firebaseapp.com",
            projectId: "bmn-lapas-arma",
            storageBucket: "bmn-lapas-arma.firebasestorage.app",
            messagingSenderId: "928672297876",
            appId: "1:928672297876:web:418f0f959d105b1fe5d581"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. Fungsi Mengambil Data BMN dari Firebase
        function loadDataFromFirebase() {
            const tableBody = document.querySelector('#bmnTable tbody');
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Memuat data dari database... <i class="fas fa-spinner fa-spin"></i></td></tr>';

            db.collection("bmn_items").get().then((querySnapshot) => {
                tableBody.innerHTML = ''; // Kosongkan tabel loading
                
                if (querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data barang</td></tr>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Tentukan warna badge berdasarkan kondisi
                    let badgeClass = 'badge-baik';
                    if(data.kondisi === 'Rusak Ringan') badgeClass = 'badge-rusak-ringan';
                    if(data.kondisi === 'Rusak Berat') badgeClass = 'badge-rusak-berat';

                    // Tangani jika field foto kosong
                    const fotoSrc = data.foto ? data.foto : 'https://via.placeholder.com/50?text=No+Img';

                    // Buat baris tabel baru
                    const row = `
                        <tr data-ruangan="${data.ruangan}">
                            <td><img src="${fotoSrc}" class="item-img" alt="${data.nama}"></td>
                            <td>${data.nama}</td>
                            <td>${data.merk}</td>
                            <td>${data.ruangan}</td>
                            <td><span class="badge ${badgeClass}">${data.kondisi}</span></td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });

                // Setelah data selesai dimuat, jalankan filter barcode (jika ada)
                cekBarcodeDanFilter();
            }).catch((error) => {
                console.error("Error mengambil data: ", error);
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;"><i class="fas fa-exclamation-triangle"></i> Gagal memuat data dari database.</td></tr>';
            });
        }

        // 3. Fungsi Filter dan Barcode
        function cekBarcodeDanFilter() {
            const urlParams = new URLSearchParams(window.location.search);
            const ruanganDariBarcode = urlParams.get('ruangan');
            const filterDropdown = document.getElementById('ruanganFilter');

            if (ruanganDariBarcode) {
                let optionExists = Array.from(filterDropdown.options).some(opt => opt.value === ruanganDariBarcode);
                if (optionExists) {
                    filterDropdown.value = ruanganDariBarcode;
                }
            }
            filterTable();
        }

        function filterTable() {
            const selectedRuangan = document.getElementById('ruanganFilter').value;
            const rows = document.querySelectorAll('#bmnTable tbody tr');

            rows.forEach((row, index) => {
                row.style.animation = 'none';
                row.style.opacity = '0';
                
                if (selectedRuangan === 'Semua' || row.getAttribute('data-ruangan') === selectedRuangan) {
                    row.style.display = 'table-row';
                    setTimeout(() => {
                        row.style.animation = `scaleIn 0.3s ease-out forwards`;
                    }, index * 80); 
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // 4. Jalankan saat halaman dibuka
        document.addEventListener('DOMContentLoaded', loadDataFromFirebase);
    </script>
</body>
</html>
