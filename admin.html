<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin BMN - Lapas Kelas IIB Arga Makmur</title>
    
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-edit {
            background-color: var(--warning);
            color: white;
        }

        .btn-edit:hover {
            background-color: #d97706;
        }

        /* Styling Tabel */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        #file-status {
            font-size: 0.9em;
            color: green;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fas fa-boxes"></i> Panel Admin BMN Lapas Arga Makmur</h2>
        <p>Kelola Data Barang Milik Negara dan Lokasi Ruangan</p>
    </div>

    <!-- AREA FORM INPUT & EDIT BARANG -->
    <div class="card">
        <h3 style="margin-top:0; color: var(--primary);"><i class="fas fa-plus-circle"></i> Form Input / Edit Barang</h3>
        
        <form id="bmnForm" onsubmit="handleSaveItem(event)">
            <!-- Input Hidden untuk menyimpan ID saat Edit -->
            <input type="hidden" id="itemId">

            <div class="form-group">
                <label>Nama Barang</label>
                <input type="text" id="inputNamaBarang" class="form-control" required placeholder="Contoh: Printer EPSON">
            </div>

            <div class="form-group">
                <label>Merk/Tipe</label>
                <input type="text" id="inputMerkBarang" class="form-control" required placeholder="Contoh: L3110">
            </div>

            <div class="form-group">
                <label>Jumlah</label>
                <input type="number" id="inputJumlahBarang" class="form-control" required min="1" value="1">
            </div>

            <div class="form-group">
                <label>Lokasi Ruangan</label>
                <select id="ruanganSelect" class="form-control" required>
                    <option value="">-- Pilih Ruangan --</option>
                    <!-- Opsi ruangan akan dimuat dari Firebase -->
                </select>
            </div>

            <div class="form-group">
                <label>Kondisi Barang</label>
                <select id="inputKondisi" class="form-control" required>
                    <option value="Baik">Baik</option>
                    <option value="Rusak Ringan">Rusak Ringan</option>
                    <option value="Rusak Berat">Rusak Berat</option>
                </select>
            </div>

            <div class="form-group">
                <label>Foto Barang (Opsional)</label>
                <input type="file" id="inputFoto" class="form-control" accept="image/*">
                <div id="file-status"><i class="fas fa-check-circle"></i> Foto berhasil dimuat siap disimpan</div>
            </div>

            <button type="submit" class="btn-primary" id="btnSubmit">
                <i class="fas fa-save"></i> Simpan Data Barang
            </button>
            <button type="button" onclick="resetFormBarang()" class="btn-edit" style="background-color: #6b7280; margin-left: 10px;">
                <i class="fas fa-undo"></i> Batal / Reset
            </button>
        </form>
    </div>

    <!-- AREA TABEL DAFTAR BARANG (Untuk melihat dan mengedit) -->
    <div class="card" style="overflow-x: auto;">
        <h3 style="margin-top:0; color: var(--primary);"><i class="fas fa-list"></i> Daftar Barang BMN</h3>
        <table id="itemTable">
            <thead>
                <tr>
                    <th>Nama & Merk Barang</th>
                    <th>Jumlah</th>
                    <th>Kondisi</th>
                    <th>Lokasi Ruangan</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data barang dari firebase masuk kesini -->
                <tr><td colspan="5" style="text-align:center;">Memuat data... <i class="fas fa-spinner fa-spin"></i></td></tr>
            </tbody>
        </table>
    </div>

</div>

<!-- Firebase App (the core Firebase SDK) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<!-- Firebase Firestore -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    // ==========================================
    // 1. MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI
    // ==========================================
    const firebaseConfig = {
        apiKey: "API_KEY_ANDA",
        authDomain: "PROJECT_ID_ANDA.firebaseapp.com",
        projectId: "PROJECT_ID_ANDA",
        storageBucket: "PROJECT_ID_ANDA.appspot.com",
        messagingSenderId: "SENDER_ID_ANDA",
        appId: "APP_ID_ANDA"
    };

    // Inisialisasi Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ==========================================
    // 2. VARIABEL GLOBAL & EVENT LISTENER
    // ==========================================
    let base64Foto = "";
    let items = []; // Menyimpan data sementara untuk fungsi edit

    // Ubah gambar jadi base64 saat file dipilih
    document.getElementById('inputFoto').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                base64Foto = event.target.result;
                document.getElementById('file-status').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // ==========================================
    // 3. FUNGSI MEMUAT DATA RUANGAN (DROPDOWN)
    // ==========================================
    function loadRuanganFromFirebase() {
        db.collection("ruangan").orderBy("nama").onSnapshot((querySnapshot) => {
            const select = document.getElementById('ruanganSelect');
            select.innerHTML = '<option value="">-- Pilih Ruangan --</option>'; // Reset
            
            querySnapshot.forEach((doc) => {
                select.innerHTML += `<option value="${doc.data().nama}">${doc.data().nama}</option>`;
            });
        });
    }

    // ==========================================
    // 4. FUNGSI MEMUAT DATA BARANG (TABEL)
    // ==========================================
    function loadItemsDataFromFirebase() {
        const tbody = document.querySelector('#itemTable tbody');
        
        db.collection("bmn_items").orderBy("waktu_input", "desc").onSnapshot((querySnapshot) => {
            items = [];
            tbody.innerHTML = '';
            
            if (querySnapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada data barang</td></tr>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                items.push({ id: doc.id, ...data }); // Simpan ke array global untuk edit

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <strong>${data.nama}</strong><br>
                            <small style="color:var(--text-light)">${data.merk}</small>
                        </td>
                        <td>${data.jumlah}</td>
                        <td>
                            <span style="padding:3px 8px; border-radius:12px; font-size:12px; 
                                ${data.kondisi === 'Baik' ? 'background:#d1fae5; color:#065f46;' : 
                                  data.kondisi === 'Rusak Ringan' ? 'background:#fef3c7; color:#92400e;' : 
                                  'background:#fee2e2; color:#b91c1c;'}">
                                ${data.kondisi}
                            </span>
                        </td>
                        <td><strong>${data.ruangan}</strong></td>
                        <td>
                            <button type="button" class="btn-edit" onclick="editItem('${doc.id}')" title="Edit Data">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                        </td>
                    </tr>
                `;
            });
        });
    }

    // ==========================================
    // 5. FUNGSI MENYIAPKAN FORM EDIT
    // ==========================================
    function editItem(docId) {
        const item = items.find(i => i.id === docId);
        if (item) {
            // Isi form dengan data yang ada di database
            document.getElementById('itemId').value = item.id;
            document.getElementById('inputNamaBarang').value = item.nama;
            document.getElementById('inputMerkBarang').value = item.merk;
            document.getElementById('inputJumlahBarang').value = item.jumlah;
            document.getElementById('ruanganSelect').value = item.ruangan;
            document.getElementById('inputKondisi').value = item.kondisi;
            
            // Ubah tombol submit menjadi mode update
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.innerHTML = '<i class="fas fa-save"></i> Update Data Barang';
            btnSubmit.classList.replace('btn-primary', 'btn-edit');
            
            // Scroll layar otomatis ke atas (ke arah form)
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    // ==========================================
    // 6. FUNGSI MENYIMPAN / MENGUPDATE BARANG
    // ==========================================
    function handleSaveItem(e) {
        e.preventDefault(); // Mencegah reload halaman

        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

        const itemId = document.getElementById('itemId').value;
        const namaBarang = document.getElementById('inputNamaBarang').value;
        const merkBarang = document.getElementById('inputMerkBarang').value;
        const jumlahBarang = document.getElementById('inputJumlahBarang').value;
        const ruangan = document.getElementById('ruanganSelect').value;
        const kondisi = document.getElementById('inputKondisi').value;

        // Susun data
        let dataToSave = {
            nama: namaBarang,
            merk: merkBarang,
            jumlah: Number(jumlahBarang), 
            ruangan: ruangan,
            kondisi: kondisi
        };

        if (base64Foto !== "") {
            dataToSave.foto = base64Foto;
        }

        // CEK APAKAH INI EDIT ATAU BARU
        if (itemId) {
            // PROSES UPDATE DATA (EDIT)
            db.collection("bmn_items").doc(itemId).update(dataToSave)
            .then(() => {
                alert("Perubahan data berhasil disimpan!");
                resetFormBarang();
            }).catch(error => { 
                alert("Gagal update data!"); 
                console.error(error); 
                resetFormBarang(); // Kembalikan state tombol
            });
        } else {
            // PROSES TAMBAH DATA BARU
            dataToSave.waktu_input = firebase.firestore.FieldValue.serverTimestamp();
            db.collection("bmn_items").add(dataToSave)
            .then(() => {
                alert("Barang baru berhasil ditambahkan!");
                resetFormBarang();
            }).catch(error => { 
                alert("Gagal menyimpan data!"); 
                console.error(error);
                resetFormBarang(); // Kembalikan state tombol
            });
        }
    }

    // ==========================================
    // 7. FUNGSI RESET FORM KEMBALI KE AWAL
    // ==========================================
    function resetFormBarang() {
        document.getElementById('bmnForm').reset();
        document.getElementById('itemId').value = '';
        document.getElementById('file-status').style.display = 'none';
        base64Foto = "";
        
        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.innerHTML = '<i class="fas fa-save"></i> Simpan Data Barang';
        btnSubmit.classList.remove('btn-edit');
        btnSubmit.classList.add('btn-primary');
        btnSubmit.disabled = false;
    }

    // ==========================================
    // 8. JALANKAN FUNGSI SAAT HALAMAN DIBUKA
    // ==========================================
    window.onload = function() {
        loadRuanganFromFirebase();
        loadItemsDataFromFirebase();
    };

</script>
</body>
</html>
