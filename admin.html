<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin BMN - Lapas Kelas IIB Arga Makmur</title>
    
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-edit {
            background-color: var(--warning);
            color: white;
        }

        .btn-edit:hover {
            background-color: #d97706;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-secondary {
            background-color: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #4b5563;
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        /* Styling Tabel */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        #file-status {
            font-size: 0.9em;
            color: #059669;
            margin-top: 5px;
            display: none;
        }

        .img-thumb {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .preview-container {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fas fa-boxes"></i> Panel Admin BMN Lapas Arga Makmur</h2>
        <p>Kelola Data Barang Milik Negara dan Lokasi Ruangan</p>
    </div>

    <!-- AREA FORM INPUT & EDIT BARANG -->
    <div class="card">
        <h3 style="margin-top:0; color: var(--primary);"><i class="fas fa-plus-circle"></i> Form Input / Edit Barang</h3>
        
        <form id="bmnForm" onsubmit="handleSaveItem(event)">
            <!-- Input Hidden untuk menyimpan ID saat Edit -->
            <input type="hidden" id="itemId">

            <div class="form-group">
                <label for="inputNamaBarang">Nama Barang</label>
                <input type="text" id="inputNamaBarang" class="form-control" required placeholder="Contoh: Printer EPSON">
            </div>

            <div class="form-group">
                <label for="inputMerkBarang">Merk/Tipe</label>
                <input type="text" id="inputMerkBarang" class="form-control" required placeholder="Contoh: L3110">
            </div>

            <div class="form-group">
                <label for="inputJumlahBarang">Jumlah</label>
                <input type="number" id="inputJumlahBarang" class="form-control" required min="1" value="1">
            </div>

            <div class="form-group">
                <label for="ruanganSelect">Lokasi Ruangan</label>
                <select id="ruanganSelect" class="form-control" required>
                    <option value="">-- Pilih Ruangan --</option>
                    <!-- Opsi ruangan dimuat dinamis dari bmn_rooms -->
                </select>
            </div>

            <div class="form-group">
                <label for="inputKondisi">Kondisi Barang</label>
                <select id="inputKondisi" class="form-control" required>
                    <option value="Baik">Baik</option>
                    <option value="Rusak Ringan">Rusak Ringan</option>
                    <option value="Rusak Berat">Rusak Berat</option>
                </select>
            </div>

            <div class="form-group">
                <label for="inputFoto">Foto Barang (Opsional)</label>
                <input type="file" id="inputFoto" class="form-control" accept="image/*">
                <div id="file-status"><i class="fas fa-check-circle"></i> Foto berhasil dimuat dan siap disimpan</div>
                <div id="previewBox" class="preview-container" style="display: none;">
                    <img id="imgPreview" class="img-thumb" src="" alt="Preview Foto">
                    <small style="color: var(--text-light)">Preview foto barang</small>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="btnSubmit">
                <i class="fas fa-save"></i> Simpan Data Barang
            </button>
            <button type="button" onclick="resetFormBarang()" class="btn-secondary" style="margin-left: 10px;">
                <i class="fas fa-undo"></i> Batal / Reset
            </button>
        </form>
    </div>

    <!-- AREA TABEL DAFTAR BARANG -->
    <div class="card" style="overflow-x: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
            <h3 style="margin: 0; color: var(--primary);"><i class="fas fa-list"></i> Daftar Barang BMN</h3>
            
            <!-- Dropdown Filter Ruangan -->
            <div style="display: flex; align-items: center; gap: 10px;">
                <label for="filterRuangan" style="font-weight: 600; font-size: 14px; color: var(--text-light);">Filter Ruangan:</label>
                <select id="filterRuangan" class="form-control" style="width: auto; min-width: 200px; padding: 6px 10px;" onchange="renderTable()">
                    <option value="Semua">-- Semua Ruangan --</option>
                    <!-- Opsi filter dimuat otomatis dari bmn_rooms -->
                </select>
            </div>
        </div>

        <table id="itemTable">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nama & Merk Barang</th>
                    <th>Jumlah</th>
                    <th>Kondisi</th>
                    <th>Lokasi Ruangan</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data barang dari firebase masuk kesini -->
                <tr><td colspan="6" style="text-align:center;">Memuat data... <i class="fas fa-spinner fa-spin"></i></td></tr>
            </tbody>
        </table>
    </div>

</div>

<!-- Firebase App (the core Firebase SDK) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<!-- Firebase Firestore -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    // ==========================================
    // 1. KONFIGURASI FIREBASE
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyB0qOgDA7xq1hP5KkuDyFf8nAJyFAMvkRc", // Ganti dengan Web API Key dari Firebase Console
        authDomain: "bmn-lapas-arma.firebaseapp.com",
        projectId: "bmn-lapas-arma",
        storageBucket: "bmn-lapas-arma.firebasestorage.app",
        messagingSenderId: "928672297876",
        appId: "1:928672297876:web:418f0f959d105b1fe5d581"
    };

    // Inisialisasi Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ==========================================
    // 2. VARIABEL GLOBAL & EVENT LISTENER
    // ==========================================
    let base64Foto = "";
    let items = []; // Menyimpan data sementara untuk fungsi edit dan filter

    // Konversi gambar ke base64 saat file dipilih
    // Konversi dan KOMPRESI gambar ke base64 saat file dipilih
    document.getElementById('inputFoto').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Buat elemen canvas virtual untuk memperkecil gambar
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;  // Batas maksimal lebar foto (pixel)
                    const MAX_HEIGHT = 800; // Batas maksimal tinggi foto (pixel)
                    
                    let width = img.width;
                    let height = img.height;

                    // Hitung rasio aspek untuk mempertahankan bentuk asli foto
                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height = Math.round(height *= MAX_WIDTH / width);
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width = Math.round(width *= MAX_HEIGHT / height);
                            height = MAX_HEIGHT;
                        }
                    }

                    // Terapkan ukuran baru ke canvas
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Konversi gambar di canvas menjadi base64 dengan format JPEG dan kualitas 60%
                    // Ini akan memangkas ukuran file drastis dari MB menjadi puluhan/ratusan KB saja
                    base64Foto = canvas.toDataURL('image/jpeg', 0.6);
                    
                    document.getElementById('file-status').style.display = 'block';
                    document.getElementById('file-status').innerHTML = '<i class="fas fa-check-circle"></i> Foto berhasil dikompresi dan siap disimpan';
                    document.getElementById('imgPreview').src = base64Foto;
                    document.getElementById('previewBox').style.display = 'flex';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    });

    // ==========================================
    // 3. MEMUAT DATA RUANGAN (FORM & FILTER)
    // ==========================================
    function loadRuanganFromFirebase() {
        db.collection("bmn_rooms").onSnapshot((querySnapshot) => {
            const selectForm = document.getElementById('ruanganSelect');
            const selectFilter = document.getElementById('filterRuangan');
            
            if (querySnapshot.empty) {
                selectForm.innerHTML = '<option value="">-- Data Ruangan Kosong --</option>';
                selectFilter.innerHTML = '<option value="Semua">-- Semua Ruangan --</option>';
                return;
            }

            let optionsForm = '<option value="">-- Pilih Ruangan --</option>';
            let optionsFilter = '<option value="Semua">-- Semua Ruangan --</option>';
            let listRuangan = [];

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const namaRuangan = data.nama || data.nama_ruangan || data.ruangan || data.room_name || doc.id;
                if (namaRuangan) {
                    listRuangan.push(namaRuangan);
                }
            });

            // Urutkan nama ruangan A-Z
            listRuangan.sort((a, b) => a.localeCompare(b));

            listRuangan.forEach((nama) => {
                optionsForm += `<option value="${nama}">${nama}</option>`;
                optionsFilter += `<option value="${nama}">${nama}</option>`;
            });

            selectForm.innerHTML = optionsForm;
            
            // Pertahankan nilai filter yang sedang aktif jika ada
            const currentFilterValue = selectFilter.value;
            selectFilter.innerHTML = optionsFilter;
            if (listRuangan.includes(currentFilterValue)) {
                selectFilter.value = currentFilterValue;
            }
        }, (error) => {
            console.error("Gagal memuat data dari bmn_rooms:", error);
            alert("Gagal memuat data ruangan: " + error.message);
        });
    }

    // ==========================================
    // 4. MEMUAT DATA BARANG DARI FIREBASE
    // ==========================================
    function loadItemsDataFromFirebase() {
        db.collection("bmn_items").orderBy("waktu_input", "desc").onSnapshot((querySnapshot) => {
            items = []; // Reset array global
            
            querySnapshot.forEach((doc) => {
                items.push({ id: doc.id, ...doc.data() });
            });
            
            // Render ulang tabel
            renderTable();
            
        }, (error) => {
            console.error("Gagal memuat data barang:", error);
            document.querySelector('#itemTable tbody').innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Gagal memuat data dari database.</td></tr>';
        });
    }

    // ==========================================
    // 5. RENDER TABEL & FILTER LOKASI
    // ==========================================
    function renderTable() {
        const tbody = document.querySelector('#itemTable tbody');
        const filterValue = document.getElementById('filterRuangan').value;
        
        // Logika Filter
        let filteredItems = items;
        if (filterValue !== "Semua") {
            filteredItems = items.filter(item => item.ruangan === filterValue);
        }

        // Tampilan jika data kosong
        if (filteredItems.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada data barang ${filterValue !== 'Semua' ? 'di ruangan <b>' + filterValue + '</b>' : ''}</td></tr>`;
            return;
        }

        let rowsHtml = '';
        filteredItems.forEach((data) => {
            const fotoHtml = data.foto 
                ? `<img src="${data.foto}" class="img-thumb" alt="Foto">` 
                : `<span style="color:var(--text-light); font-size:12px;">Tanpa Foto</span>`;

            rowsHtml += `
                <tr>
                    <td>${fotoHtml}</td>
                    <td>
                        <strong>${data.nama || '-'}</strong><br>
                        <small style="color:var(--text-light)">${data.merk || '-'}</small>
                    </td>
                    <td>${data.jumlah || 0}</td>
                    <td>
                        <span style="padding:3px 8px; border-radius:12px; font-size:12px; 
                            ${data.kondisi === 'Baik' ? 'background:#d1fae5; color:#065f46;' : 
                              data.kondisi === 'Rusak Ringan' ? 'background:#fef3c7; color:#92400e;' : 
                              'background:#fee2e2; color:#b91c1c;'}">
                            ${data.kondisi || '-'}
                        </span>
                    </td>
                    <td><strong>${data.ruangan || '-'}</strong></td>
                    <td>
                        <div class="action-btns">
                            <button type="button" class="btn-edit" onclick="editItem('${data.id}')" title="Edit Data">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button type="button" class="btn-danger" onclick="deleteItem('${data.id}')" title="Hapus Data">
                                <i class="fas fa-trash"></i> Hapus
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = rowsHtml;
    }

    // ==========================================
    // 6. MENYIAPKAN FORM EDIT
    // ==========================================
    function editItem(docId) {
        const item = items.find(i => i.id === docId);
        if (item) {
            document.getElementById('itemId').value = item.id;
            document.getElementById('inputNamaBarang').value = item.nama || '';
            document.getElementById('inputMerkBarang').value = item.merk || '';
            document.getElementById('inputJumlahBarang').value = item.jumlah || 1;
            document.getElementById('ruanganSelect').value = item.ruangan || '';
            document.getElementById('inputKondisi').value = item.kondisi || 'Baik';
            
            if (item.foto) {
                document.getElementById('imgPreview').src = item.foto;
                document.getElementById('previewBox').style.display = 'flex';
            } else {
                document.getElementById('previewBox').style.display = 'none';
            }
            
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.innerHTML = '<i class="fas fa-save"></i> Update Data Barang';
            btnSubmit.classList.replace('btn-primary', 'btn-edit');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    // ==========================================
    // 7. MENGAHUS BARANG
    // ==========================================
    function deleteItem(docId) {
        if (confirm("Apakah Anda yakin ingin menghapus barang ini dari sistem?")) {
            db.collection("bmn_items").doc(docId).delete()
            .then(() => {
                alert("Barang berhasil dihapus!");
                if (document.getElementById('itemId').value === docId) {
                    resetFormBarang();
                }
            })
            .catch(error => {
                alert("Gagal menghapus data!");
                console.error("Error deleting document: ", error);
            });
        }
    }

    // ==========================================
    // 8. MENYIMPAN / MENGUPDATE BARANG
    // ==========================================
    function handleSaveItem(e) {
        e.preventDefault();

        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

        const itemId = document.getElementById('itemId').value;
        const namaBarang = document.getElementById('inputNamaBarang').value;
        const merkBarang = document.getElementById('inputMerkBarang').value;
        const jumlahBarang = document.getElementById('inputJumlahBarang').value;
        const ruangan = document.getElementById('ruanganSelect').value;
        const kondisi = document.getElementById('inputKondisi').value;

        let dataToSave = {
            nama: namaBarang,
            merk: merkBarang,
            jumlah: Number(jumlahBarang), 
            ruangan: ruangan,
            kondisi: kondisi
        };

        if (base64Foto !== "") {
            dataToSave.foto = base64Foto;
        }

        if (itemId) {
            // EDIT / UPDATE DATA
            db.collection("bmn_items").doc(itemId).update(dataToSave)
            .then(() => {
                alert("Perubahan data berhasil disimpan!");
                resetFormBarang();
            }).catch(error => { 
                alert("Gagal update data!"); 
                console.error("Error updating document: ", error); 
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fas fa-save"></i> Update Data Barang';
            });
        } else {
            // TAMBAH DATA BARU
            dataToSave.waktu_input = firebase.firestore.FieldValue.serverTimestamp();
            db.collection("bmn_items").add(dataToSave)
            .then(() => {
                alert("Barang baru berhasil ditambahkan!");
                resetFormBarang();
            }).catch(error => { 
                alert("Gagal menyimpan data!"); 
                console.error("Error adding document: ", error);
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fas fa-save"></i> Simpan Data Barang';
            });
        }
    }

    // ==========================================
    // 9. RESET FORM
    // ==========================================
    function resetFormBarang() {
        document.getElementById('bmnForm').reset();
        document.getElementById('itemId').value = '';
        document.getElementById('file-status').style.display = 'none';
        document.getElementById('previewBox').style.display = 'none';
        document.getElementById('imgPreview').src = '';
        base64Foto = "";
        
        const btnSubmit = document.getElementById('btnSubmit');
        btnSubmit.innerHTML = '<i class="fas fa-save"></i> Simpan Data Barang';
        btnSubmit.classList.remove('btn-edit');
        btnSubmit.classList.add('btn-primary');
        btnSubmit.disabled = false;
    }

    // ==========================================
    // 10. JALANKAN SAAT HALAMAN DIBUKA
    // ==========================================
    window.onload = function() {
        loadRuanganFromFirebase();
        loadItemsDataFromFirebase();
    };
</script>
</body>
</html>
